[project]
name = "Beer-hemian"
dynamic = ["version"]
description = "Analysis of sound files"
authors = [
    {name = "Alicja Jagielska"},
    {name = "Szymon Książek"}
]
dependencies = [
    "av",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "IPython",
]
requires-python = ">= 3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.*"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beerhemian"]

[tool.hatch.version]
source = "vcs"
